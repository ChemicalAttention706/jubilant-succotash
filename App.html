<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summer Staff Scheduler</title>
    
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.0/babel.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    
    <script>
        try {
            if (localStorage.getItem('scheduler_dark_mode') === 'true') {
                document.documentElement.classList.add('dark');
            }
        } catch (e) {}
    </script>

    <style>
        body { font-family: sans-serif; transition: background-color 0.3s, color 0.3s; }
        html.dark { color-scheme: dark; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
        html.dark ::-webkit-scrollbar-thumb { background: #4b5563; }
        html.dark ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        html { scrollbar-width: thin; scrollbar-color: #d1d5db transparent; }
        html.dark { scrollbar-color: #4b5563 transparent; }
    </style>
</head>
<body class="bg-gray-200 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        
        const SHIFTS = {
            COORD: [
                { id: 'COORD_WC_A', name: 'WC (7am - 1pm)', hours: 6, track: 'COORDINATOR', subTrack: 'WC', startHour: 7, endHour: 13 },
                { id: 'COORD_WC_B', name: 'WC (1pm - 7pm)', hours: 6, track: 'COORDINATOR', subTrack: 'WC', startHour: 13, endHour: 19 },
                { id: 'COORD_PC_A', name: 'Prep (9am - 2pm)', hours: 5, track: 'COORDINATOR', subTrack: 'PREP', startHour: 9, endHour: 14 },
                { id: 'COORD_PC_B', name: 'Prep (2pm - 7pm)', hours: 5, track: 'COORDINATOR', subTrack: 'PREP', startHour: 14, endHour: 19 }
            ],
            PREP: [
                { id: 'PREP_A', name: '9am - 2pm', hours: 5, track: 'PREP_CREW', startHour: 9, endHour: 14 },
                { id: 'PREP_B', name: '2pm - 7pm', hours: 5, track: 'PREP_CREW', startHour: 14, endHour: 19 }
            ],
            WC: [
                { id: 'WC_A', name: '7am - 1pm', hours: 6, track: 'WELCOME_CENTER', startHour: 7, endHour: 13 },
                { id: 'WC_B', name: '1pm - 7pm', hours: 6, track: 'WELCOME_CENTER', startHour: 13, endHour: 19 },
                { id: 'WC_C', name: '7pm - 12am', hours: 5, track: 'WELCOME_CENTER', startHour: 19, endHour: 24 }
            ]
        };

        const OPENING_SHIFTS = ['COORD_WC_A', 'COORD_PC_A', 'PREP_A', 'WC_A'];
        const CLOSING_SHIFTS = ['WC_C']; 

        const safeSetItem = (key, value) => {
            try {
                localStorage.setItem(key, value);
            } catch (error) {
                console.warn(`Local storage error saving ${key}. Quota may be exceeded.`, error);
            }
        };

        const generateId = () => {
            if (typeof crypto !== 'undefined' && crypto.randomUUID) {
                return crypto.randomUUID();
            }
            return 'id-' + Math.random().toString(36).substr(2, 9) + '-' + Date.now().toString(36);
        };

        const App = () => {
            const fileInputRef = useRef(null);
            const newStudentNameRef = useRef(null);

            const [isDarkMode, setIsDarkMode] = useState(() => {
                try { return JSON.parse(localStorage.getItem('scheduler_dark_mode')) || false; } catch(e) { return false; }
            });

            const [settings, setSettings] = useState(() => {
                try {
                    const saved = localStorage.getItem('scheduler_settings_v4');
                    return saved ? JSON.parse(saved) : { maxHours: 29, poolCoord: 6, poolGeneral: 33 };
                } catch(e) { return { maxHours: 29, poolCoord: 6, poolGeneral: 33 }; }
            });

            const [students, setStudents] = useState(() => {
                try {
                    const saved = localStorage.getItem('scheduler_students_v4');
                    return saved ? JSON.parse(saved) : [];
                } catch(e) { return []; }
            });

            const [targets, setTargets] = useState(() => {
                const defaultTargets = {
                    COORD_WC_A: { weekday: 1, weekend: 1 }, 
                    COORD_WC_B: { weekday: 1, weekend: 1 }, 
                    COORD_PC_A: { weekday: 1, weekend: 0 }, 
                    COORD_PC_B: { weekday: 1, weekend: 0 }, 
                    PREP_A: { weekday: 5, weekend: 0 }, 
                    PREP_B: { weekday: 5, weekend: 0 }, 
                    WC_A: { weekday: 2, weekend: 2 }, 
                    WC_B: { weekday: 2, weekend: 2 }, 
                    WC_C: { weekday: 3, weekend: 3 }
                };
                try {
                    const saved = localStorage.getItem('scheduler_targets_v4');
                    return saved ? { ...defaultTargets, ...JSON.parse(saved) } : defaultTargets;
                } catch(e) { return defaultTargets; }
            });

            const [schedules, setSchedules] = useState(() => {
                try {
                    const saved = localStorage.getItem('scheduler_schedules_v4');
                    return saved ? JSON.parse(saved) : { 1: {} };
                } catch(e) { return { 1: {} }; }
            });

            const [customShifts, setCustomShifts] = useState(() => {
                try {
                    const saved = localStorage.getItem('scheduler_custom_shifts_v1');
                    return saved ? JSON.parse(saved) : [];
                } catch(e) { return []; }
            });

            const [currentWeek, setCurrentWeek] = useState(1);
            const [activeTab, setActiveTab] = useState('roster'); 
            const [activeGridTab, setActiveGridTab] = useState('COORD');
            
            const [newStudentRole, setNewStudentRole] = useState("GENERAL");
            const [editingStudentId, setEditingStudentId] = useState(null); 
            
            const [confirmDialog, setConfirmDialog] = useState(null);
            const [infoDialog, setInfoDialog] = useState(null);
            const [openDropdown, setOpenDropdown] = useState(null);
            const [newCustomShift, setNewCustomShift] = useState({ 
                name: '', startHour: 9, endHour: 12, days: [] 
            });

            const schedule = schedules[currentWeek] || {};

            const ALL_SHIFTS = useMemo(() => [
                ...SHIFTS.COORD, ...SHIFTS.PREP, ...SHIFTS.WC, ...customShifts
            ], [customShifts]);

            useEffect(() => { safeSetItem('scheduler_dark_mode', JSON.stringify(isDarkMode)); document.documentElement.classList.toggle('dark', isDarkMode); }, [isDarkMode]);
            useEffect(() => { safeSetItem('scheduler_settings_v4', JSON.stringify(settings)); }, [settings]);
            useEffect(() => { safeSetItem('scheduler_students_v4', JSON.stringify(students)); }, [students]);
            useEffect(() => { safeSetItem('scheduler_targets_v4', JSON.stringify(targets)); }, [targets]);
            useEffect(() => { safeSetItem('scheduler_schedules_v4', JSON.stringify(schedules)); }, [schedules]);
            useEffect(() => { safeSetItem('scheduler_custom_shifts_v1', JSON.stringify(customShifts)); }, [customShifts]);

            const updateCurrentSchedule = (newScheduleData) => setSchedules(prev => ({ ...prev, [currentWeek]: newScheduleData }));

            const promptConfirm = (title, message, actionText, actionFn, isDestructive = true) => {
                setConfirmDialog({ title, message, actionText, actionFn, isDestructive });
            };

            const promptInfo = (title, message) => {
                setInfoDialog({ title, message });
            };

            const handleDeleteStudent = (idToRemove) => {
                promptConfirm(
                    "Remove Student", 
                    "Are you sure you want to remove this student? This will also remove them from all active schedules.",
                    "Remove Student",
                    () => {
                        setStudents(prev => prev.filter(s => s.id !== idToRemove));
                        setSchedules(prevSchedules => {
                            const updatedSchedules = { ...prevSchedules };
                            Object.keys(updatedSchedules).forEach(weekNum => {
                                const weekSched = { ...updatedSchedules[weekNum] };
                                Object.keys(weekSched).forEach(slotId => {
                                    weekSched[slotId] = weekSched[slotId].filter(id => id !== idToRemove);
                                });
                                updatedSchedules[weekNum] = weekSched;
                            });
                            return updatedSchedules;
                        });
                        if (editingStudentId === idToRemove) setEditingStudentId(null);
                    }
                );
            };

            const handleClearRoster = () => {
                promptConfirm(
                    "Clear Entire Roster",
                    "Are you sure you want to delete ALL students? This will also clear ALL assigned shifts across ALL weeks! This cannot be undone.",
                    "Clear Roster",
                    () => {
                        setStudents([]);
                        setSchedules({ 1: {} });
                        setCurrentWeek(1);
                        setEditingStudentId(null);
                    }
                );
            };

            const globalStats = useMemo(() => {
                const stats = {};
                students.forEach(s => stats[s.id] = { ...s, totalHours: 0, activeWeeks: new Set(), wcShifts: 0, prepShifts: 0 });
                
                Object.entries(schedules).forEach(([weekNum, weekSched]) => {
                    Object.entries(weekSched).forEach(([slotId, assignedIds]) => {
                        const parts = slotId.split('::');
                        if (parts.length < 2) return;
                        const shiftId = parts[1];
                        const shiftType = ALL_SHIFTS.find(s => s.id === shiftId);
                        const shiftHours = shiftType ? shiftType.hours : 0; 
                        
                        assignedIds.forEach(id => {
                            if (stats[id]) {
                                stats[id].totalHours += shiftHours;
                                stats[id].activeWeeks.add(weekNum);
                                if (shiftType && shiftType.track === 'COORDINATOR') {
                                    if (shiftType.subTrack === 'WC') stats[id].wcShifts++;
                                    if (shiftType.subTrack === 'PREP') stats[id].prepShifts++;
                                }
                            }
                        });
                    });
                });

                const totalWeeks = Math.max(
                    Object.keys(schedules).filter(w => Object.keys(schedules[w]).length > 0).length,
                    1
                );
                
                Object.keys(stats).forEach(id => {
                    stats[id].rollingAvg = (stats[id].totalHours / totalWeeks).toFixed(1);
                });

                return stats;
            }, [students, schedules, ALL_SHIFTS]);

            const studentStats = useMemo(() => {
                const stats = {};
                Object.keys(globalStats).forEach(id => {
                    stats[id] = { ...globalStats[id], currentHours: 0, currentShifts: 0 };
                });

                Object.entries(schedule).forEach(([slotId, assignedIds]) => {
                    const parts = slotId.split('::');
                    if (parts.length < 2) return;
                    const shiftId = parts[1];
                    const shiftType = ALL_SHIFTS.find(s => s.id === shiftId);
                    const shiftHours = shiftType ? shiftType.hours : 0; 
                    
                    assignedIds.forEach(id => {
                        if (stats[id]) {
                            stats[id].currentHours += shiftHours;
                            stats[id].currentShifts += 1;
                        }
                    });
                });

                return stats;
            }, [globalStats, schedule, ALL_SHIFTS]);

            const coordCount = students.filter(s => s.role === 'COORDINATOR').length;
            const generalCount = students.filter(s => s.role === 'GENERAL').length;

            const checkShiftRelationship = (day, studentId, targetShift, tempSchedule) => {
                const studentShifts = ALL_SHIFTS.filter(s => 
                    s.id !== targetShift.id && (tempSchedule[`${day}::${s.id}`] || []).includes(studentId)
                );
                
                let hardOverlap = false;
                let b2b = false;

                for (const s of studentShifts) {
                    if (s.startHour < targetShift.endHour && s.endHour > targetShift.startHour) {
                        hardOverlap = true;
                    } 
                    else if (s.endHour === targetShift.startHour || s.startHour === targetShift.endHour) {
                        b2b = true;
                    }
                }
                
                return { hardOverlap, b2b };
            };

            const isTooManyConsecutiveDays = (targetDay, studentId, role, tempSchedule, allSchedules, weekNum) => {
                if (role !== 'GENERAL') return false; 
                const prevSched = allSchedules[weekNum - 1] || {};
                const nextSched = allSchedules[weekNum + 1] || {};
                const worksOnDay = (d, sched) => Object.keys(sched).some(slot => slot.startsWith(`${d}::`) && (sched[slot] || []).includes(studentId));

                const streakTimeline = [
                    ...DAYS.map(d => worksOnDay(d, prevSched)),
                    ...DAYS.map(d => d === targetDay ? true : worksOnDay(d, tempSchedule)),
                    ...DAYS.map(d => worksOnDay(d, nextSched))
                ];

                let currentStreak = 0;
                for (let i = 0; i < streakTimeline.length; i++) {
                    if (streakTimeline[i]) {
                        currentStreak++;
                        if (currentStreak > 3) return true;
                    } else {
                        currentStreak = 0;
                    }
                }
                return false;
            };

            const isClopening = (day, studentId, targetShiftId, tempSchedule, prevWeekSchedule = {}, nextWeekSchedule = {}) => {
                const dayIndex = DAYS.indexOf(day);
                
                if (OPENING_SHIFTS.includes(targetShiftId)) {
                    if (dayIndex > 0) {
                        const prevDay = DAYS[dayIndex - 1];
                        if (CLOSING_SHIFTS.some(closer => (tempSchedule[`${prevDay}::${closer}`] || []).includes(studentId))) return true;
                    } else if (dayIndex === 0) {
                        if (CLOSING_SHIFTS.some(closer => (prevWeekSchedule[`Saturday::${closer}`] || []).includes(studentId))) return true;
                    }
                }
                
                if (CLOSING_SHIFTS.includes(targetShiftId)) {
                    if (dayIndex < 6) {
                        const nextDay = DAYS[dayIndex + 1];
                        if (OPENING_SHIFTS.some(opener => (tempSchedule[`${nextDay}::${opener}`] || []).includes(studentId))) return true;
                    } else if (dayIndex === 6) {
                        if (OPENING_SHIFTS.some(opener => (nextWeekSchedule[`Sunday::${opener}`] || []).includes(studentId))) return true;
                    }
                }
                
                return false;
            };

            const getStudentEligibility = (student, day, shift, tempSchedule, allSchedules, weekNum, stats, currentSettings) => {
                if (shift.track === 'COORDINATOR' && student.role !== 'COORDINATOR') return { isAutoEligible: false, isDisabled: true };
                if ((shift.track === 'PREP_CREW' || shift.track === 'WELCOME_CENTER' || shift.track === 'CUSTOM') && student.role !== 'GENERAL') return { isAutoEligible: false, isDisabled: true };

                const isAlreadyAssigned = (tempSchedule[`${day}::${shift.id}`] || []).includes(student.id);
                const wouldExceed = stats.currentHours + shift.hours > currentSettings.maxHours;
                
                const unavailable = student.unavailable || [];
                const isUnavailable = Array.from(
                    { length: shift.endHour - shift.startHour },
                    (_, i) => shift.startHour + i
                ).some(h => unavailable.includes(`${day}::${h}`));

                const { hardOverlap, b2b } = checkShiftRelationship(day, student.id, shift, tempSchedule);
                
                const prevWeekSchedule = allSchedules[weekNum - 1] || {};
                const nextWeekSchedule = allSchedules[weekNum + 1] || {};
                const clopening = isClopening(day, student.id, shift.id, tempSchedule, prevWeekSchedule, nextWeekSchedule);
                
                const overDays = isTooManyConsecutiveDays(day, student.id, student.role, tempSchedule, allSchedules, weekNum);

                let isDailyCoordLimitReached = false;
                if (student.role === 'COORDINATOR') {
                    const dailyCoordCount = SHIFTS.COORD.filter(cShift => (tempSchedule[`${day}::${cShift.id}`] || []).includes(student.id)).length;
                    if (dailyCoordCount >= 1 && !isAlreadyAssigned) {
                        isDailyCoordLimitReached = true;
                    }
                }

                const isDisabled = isAlreadyAssigned || wouldExceed || isUnavailable || hardOverlap || clopening || overDays || isDailyCoordLimitReached;
                const isAutoEligible = !isDisabled && !b2b;

                return { wouldExceed, isUnavailable, hardOverlap, clopening, b2b, overDays, isDailyCoordLimitReached, isDisabled, isAutoEligible };
            };

            const slotEligibility = useMemo(() => {
                const result = {};
                DAYS.forEach(day => {
                    ALL_SHIFTS.forEach(shift => {
                        const slotId = `${day}::${shift.id}`;
                        const assigned = schedule[slotId] || [];
                        const isCoord = shift.track === 'COORDINATOR';

                        const candidates = students.filter(s =>
                            !assigned.includes(s.id) &&
                            (isCoord ? s.role === 'COORDINATOR' : s.role === 'GENERAL')
                        );

                        result[slotId] = candidates.map(s => {
                            const stats = studentStats[s.id];
                            if (!stats) return null;
                            const eligibility = getStudentEligibility(s, day, shift, schedule, schedules, currentWeek, stats, settings);
                            return { student: s, stats, ...eligibility };
                        }).filter(Boolean);
                    });
                });
                return result;
            }, [students, schedule, schedules, studentStats, settings, currentWeek, ALL_SHIFTS]);

            const handleAutoAssign = () => {
                let newSchedule = { ...schedule };
                
                let currentStats = {};
                Object.keys(studentStats).forEach(id => {
                    currentStats[id] = { ...studentStats[id] };
                });
                
                const fillPass = (shiftGroup) => {
                    let slotsToFill = [];
                    DAYS.forEach(day => {
                        const isWeekend = day === 'Saturday' || day === 'Sunday';
                        shiftGroup.forEach(shift => {
                            if ((shift.track === 'PREP_CREW' || shift.subTrack === 'PREP') && isWeekend) return;
                            const slotId = `${day}::${shift.id}`;
                            const targetObj = targets[shift.id] || { weekday: 0, weekend: 0 };
                            const shiftTarget = isWeekend ? targetObj.weekend : targetObj.weekday;
                            const needed = Math.max(0, shiftTarget - (newSchedule[slotId] || []).length);
                            for (let i = 0; i < needed; i++) slotsToFill.push({ day, shift });
                        });
                    });

                    for (let i = slotsToFill.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [slotsToFill[i], slotsToFill[j]] = [slotsToFill[j], slotsToFill[i]];
                    }

                    slotsToFill.forEach(({day, shift}) => {
                        const slotId = `${day}::${shift.id}`;
                        
                        let eligible = students.filter(s => {
                            const stats = currentStats[s.id];
                            if (!stats) return false;
                            
                            const eligibility = getStudentEligibility(s, day, shift, newSchedule, schedules, currentWeek, stats, settings);
                            return eligibility.isAutoEligible;
                        });

                        if (eligible.length > 0) {
                            eligible.sort((a, b) => {
                                const statsA = currentStats[a.id];
                                const statsB = currentStats[b.id];
                                
                                if (shift.track === 'COORDINATOR') {
                                    const totalA = statsA.wcShifts + statsA.prepShifts || 1;
                                    const totalB = statsB.wcShifts + statsB.prepShifts || 1;
                                    
                                    if (shift.subTrack === 'PREP') {
                                        const ratioA = statsA.prepShifts / totalA;
                                        const ratioB = statsB.prepShifts / totalB;
                                        if (Math.abs(ratioA - ratioB) > 0.05) return ratioA - ratioB;
                                    } else if (shift.subTrack === 'WC') {
                                        const ratioA = statsA.wcShifts / totalA;
                                        const ratioB = statsB.wcShifts / totalB;
                                        if (Math.abs(ratioA - ratioB) > 0.05) return ratioA - ratioB;
                                    }
                                }
                                
                                const aUnderTarget = statsA.currentHours < 15;
                                const bUnderTarget = statsB.currentHours < 15;
                                
                                if (aUnderTarget && !bUnderTarget) return -1; 
                                if (!aUnderTarget && bUnderTarget) return 1;  
                                
                                if (statsA.currentHours !== statsB.currentHours) {
                                    return statsA.currentHours - statsB.currentHours;
                                }
                                
                                const aShiftsToday = ALL_SHIFTS.filter(sh => (newSchedule[`${day}::${sh.id}`] || []).includes(a.id)).length;
                                const bShiftsToday = ALL_SHIFTS.filter(sh => (newSchedule[`${day}::${sh.id}`] || []).includes(b.id)).length;
                                
                                const todayDiff = aShiftsToday - bShiftsToday;
                                if (todayDiff !== 0) return todayDiff;

                                return Math.random() - 0.5;
                            });

                            const selected = eligible[0];
                            newSchedule[slotId] = [...(newSchedule[slotId] || []), selected.id];
                            currentStats[selected.id].currentHours += shift.hours;
                            if (shift.track === 'COORDINATOR') {
                                if (shift.subTrack === 'WC') currentStats[selected.id].wcShifts++;
                                if (shift.subTrack === 'PREP') currentStats[selected.id].prepShifts++;
                            }
                        }
                    });
                };

                fillPass(SHIFTS.COORD);
                fillPass(SHIFTS.PREP);
                fillPass(SHIFTS.WC);
                updateCurrentSchedule(newSchedule);
            };

            const exportCSV = (allWeeks = false) => {
                const rows = [];
                const escapeCSV = (str) => {
                    let safeStr = String(str).replace(/"/g, '""');
                    if (/^[=+\-@]/.test(safeStr)) safeStr = "'" + safeStr;
                    return `"${safeStr}"`;
                };
                
                const weeksToExport = allWeeks ? Object.keys(schedules).sort((a,b) => parseInt(a) - parseInt(b)) : [currentWeek];
                
                weeksToExport.forEach(weekNum => {
                    const weekSched = schedules[weekNum] || {};
                    rows.push([`--- WEEK ${weekNum} SCHEDULE ---`]);
                    rows.push(["Day", "Track", "Shift", "Assigned Students"]);
                    
                    DAYS.forEach(day => {
                        ALL_SHIFTS.forEach(shift => {
                            if (shift.track === 'CUSTOM' && shift.days && !shift.days.includes(day)) {
                                return; 
                            }
                            const slotId = `${day}::${shift.id}`;
                            const assignedIds = weekSched[slotId] || [];
                            const studentNames = assignedIds.map(id => {
                                const s = students.find(st => st.id === id); 
                                const avg = globalStats[id] ? globalStats[id].rollingAvg : "0.0";
                                return s ? `${s.name} (${avg}h)` : "";
                            }).filter(n => n).join(", ");
                            rows.push([day, shift.track, shift.name, studentNames]);
                        });
                    });
                    
                    rows.push([]); 
                });

                const blob = new Blob([rows.map(r => r.map(escapeCSV).join(",")).join("\n")], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = allWeeks ? `schedule_all_weeks.csv` : `schedule_week_${currentWeek}.csv`;
                link.click();
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const text = event.target.result;
                        
                        const parseCSV = (str) => {
                            const result = [];
                            let row = [];
                            let cell = '';
                            let inQuotes = false;
                            for (let i = 0; i < str.length; i++) {
                                const char = str[i];
                                if (char === '"' && str[i+1] === '"') {
                                    cell += '"'; i++; 
                                } else if (char === '"') {
                                    inQuotes = !inQuotes;
                                } else if (char === ',' && !inQuotes) {
                                    row.push(cell.trim());
                                    cell = '';
                                } else if ((char === '\n' || char === '\r') && !inQuotes) {
                                    if (char === '\r' && str[i+1] === '\n') i++; 
                                    row.push(cell.trim());
                                    if (row.some(c => c !== '')) result.push(row);
                                    row = [];
                                    cell = '';
                                } else {
                                    cell += char;
                                }
                            }
                            if (cell !== '' || row.length > 0) {
                                row.push(cell.trim());
                                result.push(row);
                            }
                            return result;
                        };

                        const rows = parseCSV(text);
                        if (rows.length < 2) {
                            promptInfo("Error", "The CSV file appears to be empty or invalid.");
                            return;
                        }

                        const headers = rows[0];
                        
                        const nameIdx = headers.findIndex(h => {
                            const lower = h.toLowerCase();
                            return lower.includes('name') || (lower.includes('first') && lower.includes('last'));
                        });
                        const roleIdx = headers.findIndex(h => h.toLowerCase().includes('role'));
                        
                        if (nameIdx === -1 || roleIdx === -1) {
                            promptInfo("Error", "Could not find 'Name' or 'Role' columns. Are you sure this is the right Google Form CSV?");
                            return;
                        }

                        const dayCols = [];
                        headers.forEach((h, idx) => {
                            const match = h.match(/\[(Sunday|Monday|Tuesday|Wednesday|Thursday|Friday|Saturday)\]/i);
                            if (match && h.toLowerCase().includes('not available')) {
                                const normalizedDay = match[1].charAt(0).toUpperCase() + match[1].slice(1).toLowerCase();
                                dayCols.push({ index: idx, day: normalizedDay });
                            }
                        });

                        const newStudents = rows.slice(1).map((cols) => {
                            const name = cols[nameIdx];
                            if (!name) return null; 
                            
                            const roleStr = cols[roleIdx]?.toUpperCase() || "";
                            const role = roleStr.includes('COORDINATOR') ? 'COORDINATOR' : 'GENERAL';
                            
                            let unavailable = [];
                            
                            dayCols.forEach(({ index, day }) => {
                                const cellValue = cols[index];
                                if (cellValue) {
                                    const hours = cellValue.split(',').map(s => s.trim());
                                    hours.forEach(hourStr => {
                                        const timeMatch = hourStr.match(/(\d+):(\d+)\s*(AM|PM)/i);
                                        if (timeMatch) {
                                            let h = parseInt(timeMatch[1], 10);
                                            const ampm = timeMatch[3].toUpperCase();
                                            if (ampm === 'PM' && h < 12) h += 12;
                                            if (ampm === 'AM' && h === 12) h = 0;
                                            unavailable.push(`${day}::${h}`);
                                        }
                                    });
                                }
                            });

                            unavailable = Array.from(new Set(unavailable)).filter(slot => {
                                const h = parseInt(slot.split('::')[1], 10);
                                return h >= 7 && h <= 23;
                            });

                            return { id: generateId(), name, role, unavailable };
                        }).filter(Boolean).filter(s => !s.name.includes("Example")); 

                        const seen = new Map();
                        newStudents.forEach(s => seen.set(s.name.toLowerCase().trim(), s));
                        const dedupedStudents = Array.from(seen.values());

                        if (dedupedStudents.length > 0) {
                            const dupCount = newStudents.length - dedupedStudents.length;
                            const dupNote = dupCount > 0 ? ` (${dupCount} duplicate submission${dupCount > 1 ? 's' : ''} removed)` : '';
                            
                            const existingByName = new Map(students.map(s => [s.name.toLowerCase().trim(), s]));

                            let updated = 0, added = 0;
                            dedupedStudents.forEach(s => {
                                if (existingByName.has(s.name.toLowerCase().trim())) updated++;
                                else added++;
                            });

                            // This is the updated message that perfectly describes the new non-destructive import!
                            promptConfirm(
                                "Import Students",
                                `Parsed ${dedupedStudents.length} students${dupNote}. ${updated} existing student${updated !== 1 ? 's' : ''} will have their availability updated. ${added} new student${added !== 1 ? 's' : ''} will be added. No schedules will be cleared. Proceed?`,
                                "Import Data",
                                () => {
                                    setStudents(prev => {
                                        const byName = new Map(prev.map(s => [s.name.toLowerCase().trim(), s]));
                                        const incoming = new Map(dedupedStudents.map(s => [s.name.toLowerCase().trim(), s]));

                                        // Update existing students' availability
                                        const updatedList = prev.map(s => {
                                            const match = incoming.get(s.name.toLowerCase().trim());
                                            if (match) return { ...s, unavailable: match.unavailable };
                                            return s;
                                        });

                                        // Add brand new students
                                        const newStudentsList = dedupedStudents.filter(s => !byName.has(s.name.toLowerCase().trim()));
                                        return [...updatedList, ...newStudentsList];
                                    });
                                },
                                false
                            );
                        } else {
                            promptInfo("Warning", "No students were found in the file.");
                        }
                    } catch (error) {
                        console.error(error);
                        promptInfo("Error", "Error parsing CSV. Ensure it is the direct Google Form download.");
                    } finally {
                        if (fileInputRef.current) fileInputRef.current.value = ''; 
                    }
                };
                reader.readAsText(file);
            };

            const toggleAvailability = (studentId, slotId) => {
                const student = students.find(s => s.id === studentId);
                if (!student) return;
                const isUnavailable = (student.unavailable || []).includes(slotId);
                
                setStudents(students.map(s => {
                    if (s.id === studentId) {
                        return isUnavailable 
                            ? { ...s, unavailable: (s.unavailable || []).filter(u => u !== slotId) } 
                            : { ...s, unavailable: [...(s.unavailable || []), slotId] };

                                                                </span>
                                                                <span className="text-gray-500 dark:text-gray-400 font-medium">({gStats.wcShifts} WC / {gStats.prepShifts} Prep)</span>
                                                            </div>
                                                        </div>
                                                        <div className="flex items-center gap-3">
                                                            <button onClick={() => setEditingStudentId(s.id)} className="text-xs text-blue-600 dark:text-blue-400 font-medium hover:underline">Edit</button>
                                                            <button onClick={() => handleDeleteStudent(s.id)} className="text-xs text-red-500 hover:text-red-700 bg-white dark:bg-gray-800 border border-red-200 dark:border-red-900/50 rounded-full w-5 h-5 flex items-center justify-center" title="Remove Student">✕</button>
                                                        </div>
                                                    </div>
                                                )
                                            })}

                                            <div className="flex justify-between text-xs font-bold text-gray-500 uppercase tracking-wider mt-6 mb-2">
                                                <span>General Staff ({generalCount}/{settings.poolGeneral})</span>
                                            </div>
                                            {students.filter(s => s.role === 'GENERAL').map(s => {
                                                const stats = studentStats[s.id];
                                                const warning = stats.currentHours >= settings.maxHours;
                                                const isUnder = parseFloat(stats.rollingAvg) < 15;
                                                return (
                                                    <div key={s.id} className={`flex justify-between items-center p-2 rounded border ${warning ? 'bg-red-50 border-red-300 dark:bg-red-900/20' : 'bg-gray-50 dark:bg-gray-700/50 border-gray-300 dark:border-gray-600'}`}>
                                                        <div className="flex flex-col">
                                                            <span className="text-sm font-medium dark:text-gray-200">{s.name}</span>
                                                            <div className="flex gap-2 text-[10px] items-center mt-0.5">
                                                                <span className={`${warning ? 'text-red-600 font-bold' : 'text-gray-500'}`}>Week: {stats.currentHours}h</span>
                                                                <span className={`font-bold px-1 rounded ${isUnder ? 'text-amber-600 bg-amber-100 dark:bg-amber-900/40' : 'text-green-600 dark:text-green-400'}`}>
                                                                    Avg: {stats.rollingAvg}h
                                                                </span>
                                                            </div>
                                                        </div>
                                                        <div className="flex items-center gap-3">
                                                            <button onClick={() => setEditingStudentId(s.id)} className="text-xs text-blue-600 dark:text-blue-400 font-medium hover:underline">Edit</button>
                                                            <button onClick={() => handleDeleteStudent(s.id)} className="text-xs text-red-500 hover:text-red-700 bg-white dark:bg-gray-800 border border-red-200 dark:border-red-900/50 rounded-full w-5 h-5 flex items-center justify-center" title="Remove Student">✕</button>
                                                        </div>
                                                    </div>
                                                )
                                            })}
                                        </div>
                                    </div>
                                )}

                                {activeTab === 'targets' && (
                                    <div className="space-y-6">
                                        {[
                                            { title: "Coordinators", shifts: SHIFTS.COORD },
                                            { title: "Prep Crew", shifts: SHIFTS.PREP },
                                            { title: "Welcome Center", shifts: SHIFTS.WC }
                                        ].map(group => (
                                            <div key={group.title}>
                                                <h3 className="text-sm font-bold border-b border-gray-300 dark:border-gray-700 pb-1 mb-2 text-gray-700 dark:text-gray-300">{group.title}</h3>
                                                {group.shifts.map(shift => (
                                                    <div key={shift.id} className="flex justify-between items-center mb-2">
                                                        <label className="text-sm dark:text-gray-400">{shift.name}</label>
                                                        <div className="flex gap-2">
                                                            <div className="flex items-center gap-1">
                                                                <span className="text-xs text-gray-500">Wkdy:</span>
                                                                <input 
                                                                    type="number" min="0" value={targets[shift.id]?.weekday || 0}
                                                                    onChange={(e) => setTargets({...targets, [shift.id]: {...targets[shift.id], weekday: parseInt(e.target.value, 10) || 0}})}
                                                                    className="w-12 border border-gray-300 dark:border-gray-600 rounded p-1 text-center bg-white dark:bg-gray-700 outline-none"
                                                                />
                                                            </div>
                                                            <div className="flex items-center gap-1">
                                                                <span className="text-xs text-gray-500">Wknd:</span>
                                                                <input 
                                                                    type="number" min="0" value={targets[shift.id]?.weekend || 0}
                                                                    onChange={(e) => setTargets({...targets, [shift.id]: {...targets[shift.id], weekend: parseInt(e.target.value, 10) || 0}})}
                                                                    className="w-12 border border-gray-300 dark:border-gray-600 rounded p-1 text-center bg-white dark:bg-gray-700 outline-none"
                                                                />
                                                            </div>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        ))}
                                    </div>
                                )}

                                {activeTab === 'settings' && (
                                    <div className="space-y-4">
                                        <div className="bg-yellow-50 dark:bg-yellow-900/20 border border-yellow-300 dark:border-yellow-700 p-3 rounded text-sm text-yellow-800 dark:text-yellow-300 mb-4">
                                            Adjust these variables to modify the Auto-Assigner's logic constraints.<br/><br/>
                                            <strong>Scheduling Protocols:</strong><br/>
                                            • The Auto-Assigner will strictly skip weekend prep shifts, letting you assign them manually via the dashboard dropdown only.<br/>
                                            • General Staff are strictly blocked from working > 3 consecutive days across weeks.<br/>
                                            • Coordinators are strictly limited to one shift per day and balanced between WC and Prep roles.
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium mb-1">Max Hours Per Week</label>
                                            <input type="number" min="0" value={settings.maxHours} onChange={(e) => setSettings({...settings, maxHours: parseInt(e.target.value, 10) || 0})} className="w-full border border-gray-300 dark:border-gray-600 rounded p-2 bg-white dark:bg-gray-700 outline-none" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium mb-1">Target Coordinator Pool Size</label>
                                            <input type="number" min="0" value={settings.poolCoord} onChange={(e) => setSettings({...settings, poolCoord: parseInt(e.target.value, 10) || 0})} className="w-full border border-gray-300 dark:border-gray-600 rounded p-2 bg-white dark:bg-gray-700 outline-none" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium mb-1">Target General Staff Pool Size</label>
                                            <input type="number" min="0" value={settings.poolGeneral} onChange={(e) => setSettings({...settings, poolGeneral: parseInt(e.target.value, 10) || 0})} className="w-full border border-gray-300 dark:border-gray-600 rounded p-2 bg-white dark:bg-gray-700 outline-none" />
                                        </div>

                                        <div className="border-t border-gray-300 dark:border-gray-700 pt-4 mt-4">
                                            <div className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-3">Custom Shifts</div>

                                            {customShifts.length > 0 && (
                                                <div className="space-y-2 mb-4">
                                                    {customShifts.map(shift => {
                                                        const formatH = (h) => h < 12 ? `${h}am` : h === 12 ? '12pm' : `${h-12}pm`;
                                                        return (
                                                            <div key={shift.id} className="flex justify-between items-center p-2 rounded border bg-gray-50 dark:bg-gray-700/50 border-gray-300 dark:border-gray-600">
                                                                <div className="flex flex-col">
                                                                    <span className="text-sm font-medium dark:text-gray-200">{shift.name}</span>
                                                                    <span className="text-[10px] text-gray-500 mt-0.5">
                                                                        {formatH(shift.startHour)}–{formatH(shift.endHour)} · {shift.days.join(', ')}
                                                                    </span>
                                                                </div>
                                                                <button
                                                                    onClick={() => promptConfirm(
                                                                        "Delete Custom Shift",
                                                                        `Are you sure you want to delete "${shift.name}"? This will also remove all assignments for this shift across all weeks.`,
                                                                        "Delete",
                                                                        () => {
                                                                            setCustomShifts(prev => prev.filter(s => s.id !== shift.id));
                                                                            setSchedules(prevSchedules => {
                                                                                const updated = { ...prevSchedules };
                                                                                Object.keys(updated).forEach(week => {
                                                                                    const weekSched = { ...updated[week] };
                                                                                    Object.keys(weekSched).forEach(slotId => {
                                                                                        if (slotId.endsWith(`::${shift.id}`)) delete weekSched[slotId];
                                                                                    });
                                                                                    updated[week] = weekSched;
                                                                                });
                                                                                return updated;
                                                                            });
                                                                        }
                                                                    )}
                                                                    className="text-xs text-red-500 hover:text-red-700 bg-white dark:bg-gray-800 border border-red-200 dark:border-red-900/50 rounded-full w-5 h-5 flex items-center justify-center flex-shrink-0"
                                                                    title="Delete shift"
                                                                >✕</button>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            )}

                                            <div className="bg-gray-100 dark:bg-gray-700/30 p-3 rounded border border-gray-300 dark:border-gray-700 space-y-2">
                                                <input
                                                    type="text"
                                                    placeholder="Shift name (e.g. Sunday Check-In)"
                                                    value={newCustomShift.name}
                                                    onChange={(e) => setNewCustomShift(prev => ({ ...prev, name: e.target.value }))}
                                                    className="w-full border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 p-1.5 rounded text-sm outline-none"
                                                />
                                                <div className="flex gap-2">
                                                    <div className="flex-1">
                                                        <label className="block text-[10px] text-gray-500 uppercase tracking-wider mb-1">Start</label>
                                                        <select
                                                            value={newCustomShift.startHour}
                                                            onChange={(e) => setNewCustomShift(prev => ({ ...prev, startHour: parseInt(e.target.value, 10) }))}
                                                            className="w-full border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 p-1.5 rounded text-sm outline-none"
                                                        >
                                                            {Array.from({ length: 17 }, (_, i) => i + 7).map(h => (
                                                                <option key={h} value={h}>
                                                                    {h < 12 ? `${h}am` : h === 12 ? '12pm' : `${h-12}pm`}
                                                                </option>
                                                            ))}
                                                        </select>
                                                    </div>
                                                    <div className="flex-1">
                                                        <label className="block text-[10px] text-gray-500 uppercase tracking-wider mb-1">End</label>
                                                        <select
                                                            value={newCustomShift.endHour}
                                                            onChange={(e) => setNewCustomShift(prev => ({ ...prev, endHour: parseInt(e.target.value, 10) }))}
                                                            className="w-full border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 p-1.5 rounded text-sm outline-none"
                                                        >
                                                            {Array.from({ length: 17 }, (_, i) => i + 7).map(h => (
                                                                <option key={h} value={h}>
                                                                    {h < 12 ? `${h}am` : h === 12 ? '12pm' : `${h-12}pm`}
                                                                </option>
                                                            ))}
                                                        </select>
                                                    </div>
                                                </div>
                                                <div>
                                                    <label className="block text-[10px] text-gray-500 uppercase tracking-wider mb-1">Active Days</label>
                                                    <div className="flex flex-wrap gap-1">
                                                        {DAYS.map(day => (
                                                            <button
                                                                key={day}
                                                                onClick={() => toggleCustomShiftDay(day)}
                                                                className={`px-2 py-1 rounded text-[10px] font-semibold border transition-colors ${
                                                                    newCustomShift.days.includes(day)
                                                                        ? 'bg-blue-600 text-white border-blue-600'
                                                                        : 'bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-400 border-gray-300 dark:border-gray-600'
                                                                }`}
                                                            >
                                                                {day.substring(0, 3)}
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>
                                                <button
                                                    onClick={() => {
                                                        const name = newCustomShift.name.trim();
                                                        if (!name) { promptInfo("Invalid", "Please enter a shift name."); return; }
                                                        if (newCustomShift.startHour >= newCustomShift.endHour) { promptInfo("Invalid", "End time must be after start time."); return; }
                                                        if (newCustomShift.days.length === 0) { promptInfo("Invalid", "Please select at least one active day."); return; }
                                                        setCustomShifts(prev => [...prev, {
                                                            id: generateId(),
                                                            name,
                                                            track: 'CUSTOM',
                                                            subTrack: null,
                                                            hours: newCustomShift.endHour - newCustomShift.startHour,
                                                            startHour: newCustomShift.startHour,
                                                            endHour: newCustomShift.endHour,
                                                            days: newCustomShift.days
                                                        }]);
                                                        setNewCustomShift({ name: '', startHour: 9, endHour: 12, days: [] });
                                                    }}
                                                    className="w-full bg-blue-600 hover:bg-blue-700 text-white rounded py-1.5 text-sm font-medium"
                                                >
                                                    + Add Custom Shift
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* Editor Modal */}
                    {editingStudentId && editingStudent && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-40 p-4">
                            <div className="bg-white dark:bg-gray-800 rounded-lg shadow-xl w-full max-w-4xl flex flex-col max-h-[90vh] border border-gray-300 dark:border-gray-700">
                                <div className="p-4 border-b border-gray-300 dark:border-gray-700 flex justify-between items-center bg-gray-100 dark:bg-gray-900 rounded-t-lg">
                                    <h2 className="text-lg font-bold">Edit Profile: {editingStudent.name}</h2>
                                    <button onClick={() => setEditingStudentId(null)} className="text-gray-500 hover:text-gray-700">✕</button>
                                </div>
                                
                                <div className="p-4 overflow-y-auto space-y-4">
                                    <div className="flex gap-4">
                                        <div className="flex-1">
                                            <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Name</label>
                                            <input type="text" value={editingStudent.name} onChange={(e) => setStudents(students.map(s => s.id === editingStudentId ? {...s, name: e.target.value} : s))} className="w-full border border-gray-300 dark:border-gray-600 rounded p-2 bg-white dark:bg-gray-700 outline-none" />
                                        </div>
                                        <div className="w-48">
                                            <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Role</label>
                                            <select value={editingStudent.role} onChange={(e) => setStudents(students.map(s => s.id === editingStudentId ? {...s, role: e.target.value} : s))} className="w-full border border-gray-300 dark:border-gray-600 rounded p-2 bg-white dark:bg-gray-700 outline-none">
                                                <option value="GENERAL">General Staff</option>
                                                <option value="COORDINATOR">Coordinator</option>
                                            </select>
                                        </div>
                                        <div className="flex items-end">
                                             <button onClick={() => handleDeleteStudent(editingStudentId)} className="px-4 py-2 border border-red-300 text-red-600 rounded hover:bg-red-50 dark:border-red-800/50 dark:hover:bg-red-900/30">Delete Student</button>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Availability Matrix (Click to block off hours)</label>
                                        <div className="bg-blue-50 dark:bg-blue-900/20 text-blue-800 dark:text-blue-300 p-2 text-sm rounded mb-3 border border-blue-200 dark:border-blue-800/50">
                                            Mark any hours you are <strong>unavailable</strong>. Red = unavailable, white = free. Shifts spanning any blocked hour will be excluded.
                                        </div>
                                        {(() => {
                                            const AVAILABILITY_HOURS = Array.from({ length: 17 }, (_, i) => i + 7);
                                            const unavailable = editingStudent.unavailable || [];
                                            const formatHour = (h) => h < 12 ? `${h}am` : h === 12 ? '12pm' : `${h - 12}pm`;
                                            return (
                                                <div className="overflow-x-auto">
                                                    <table className="w-full border-collapse text-xs">
                                                        <thead>
                                                            <tr>
                                                                <th className="p-1 border border-gray-200 dark:border-gray-700 bg-gray-100 dark:bg-gray-900 text-gray-500 w-12">Hour</th>
                                                                {DAYS.map(day => (
                                                                    <th key={day} className="p-1 border border-gray-200 dark:border-gray-700 bg-gray-100 dark:bg-gray-900 text-gray-700 dark:text-gray-300 font-bold text-center">
                                                                        {day.substring(0, 3)}
                                                                    </th>
                                                                ))}
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            {AVAILABILITY_HOURS.map(h => (
                                                                <tr key={h}>
                                                                    <td className="p-1 border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 text-gray-500 text-center font-medium whitespace-nowrap">
                                                                        {formatHour(h)}
                                                                    </td>
                                                                    {DAYS.map(day => {
                                                                        const slotId = `${day}::${h}`;
                                                                        const isOff = unavailable.includes(slotId);
                                                                        return (
                                                                            <td key={slotId} className="p-0 border border-gray-200 dark:border-gray-700">
                                                                                <button
                                                                                    aria-pressed={isOff}
                                                                                    onClick={() => toggleAvailability(editingStudentId, slotId)}
                                                                                    className={`w-full h-7 transition-colors text-[10px] font-semibold ${isOff ? 'bg-red-200 dark:bg-red-900/60 hover:bg-red-300 dark:hover:bg-red-900 text-red-800 dark:text-red-200' : 'bg-white dark:bg-gray-800 hover:bg-gray-100 dark:hover:bg-gray-700'}`}
                                                                                >
                                                                                    {isOff ? 'Busy' : ''}
                                                                                </button>
                                                                            </td>
                                                                        );
                                                                    })}
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            );
                                        })()}
                                    </div>
                                </div>
                                <div className="p-4 border-t border-gray-300 dark:border-gray-700 flex justify-end bg-gray-100 dark:bg-gray-900 rounded-b-lg">
                                    <button onClick={() => setEditingStudentId(null)} className="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded font-medium shadow-sm">Done</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Custom Confirmation Modal */}
                    {confirmDialog && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4 animate-in fade-in duration-200">
                            <div className="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-xl border border-gray-300 dark:border-gray-700 max-w-md w-full">
                                <h3 className="text-xl font-bold mb-3 text-gray-900 dark:text-gray-100">{confirmDialog.title}</h3>
                                <p className="mb-6 text-gray-600 dark:text-gray-300">{confirmDialog.message}</p>
                                <div className="flex justify-end gap-3">
                                    <button onClick={() => setConfirmDialog(null)} className="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded bg-white dark:bg-gray-700 text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-600 transition-colors font-medium">
                                        Cancel
                                    </button>
                                    <button 
                                        onClick={() => { confirmDialog.actionFn(); setConfirmDialog(null); }} 
                                        className={`px-4 py-2 rounded text-white font-medium shadow-sm transition-colors ${confirmDialog.isDestructive ? 'bg-red-600 hover:bg-red-700' : 'bg-blue-600 hover:bg-blue-700'}`}
                                    >
                                        {confirmDialog.actionText}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Info Modal */}
                    {infoDialog && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4 animate-in fade-in duration-200">
                            <div className="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-xl border border-gray-300 dark:border-gray-700 max-w-md w-full">
                                <h3 className="text-xl font-bold mb-3 text-gray-900 dark:text-gray-100">{infoDialog.title}</h3>
                                <p className="mb-6 text-gray-600 dark:text-gray-300">{infoDialog.message}</p>
                                <div className="flex justify-end">
                                    <button onClick={() => setInfoDialog(null)} className="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded bg-blue-600 hover:bg-blue-700 text-white transition-colors font-medium shadow-sm">
                                        OK
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
