<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Shift Scheduler (Pro Version)</title>
    
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.0/babel.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    
    <script>
        try {
            if (localStorage.getItem('scheduler_dark_mode') === 'true') {
                document.documentElement.classList.add('dark');
            }
        } catch (e) {}
    </script>

    <style>
        body { font-family: sans-serif; transition: background-color 0.3s, color 0.3s; }
        html.dark { color-scheme: dark; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
        html.dark ::-webkit-scrollbar-thumb { background: #4b5563; }
        html.dark ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        html { scrollbar-width: thin; scrollbar-color: #d1d5db transparent; }
        html.dark { scrollbar-color: #4b5563 transparent; }
    </style>
</head>
<body class="bg-gray-200 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        
        const SHIFTS = {
            COORD: [
                { id: 'COORD_A', name: '7am - 1pm', hours: 6, track: 'COORDINATOR' },
                { id: 'COORD_B', name: '1pm - 7pm', hours: 6, track: 'COORDINATOR' }
            ],
            PREP: [
                { id: 'PREP_A', name: '9am - 2pm', hours: 5, track: 'PREP_CREW' },
                { id: 'PREP_B', name: '2pm - 7pm', hours: 5, track: 'PREP_CREW' }
            ],
            WC: [
                { id: 'WC_A', name: '7am - 1pm', hours: 6, track: 'WELCOME_CENTER' },
                { id: 'WC_B', name: '1pm - 7pm', hours: 6, track: 'WELCOME_CENTER' },
                { id: 'WC_C', name: '7pm - 12am', hours: 5, track: 'WELCOME_CENTER' }
            ]
        };

        const ALL_SHIFTS = [...SHIFTS.COORD, ...SHIFTS.PREP, ...SHIFTS.WC];

        const OVERLAPS = {
            'WC_A': ['PREP_A'],
            'WC_B': ['PREP_A', 'PREP_B'],
            'PREP_A': ['WC_A', 'WC_B'],
            'PREP_B': ['WC_B']
        };

        const BACK_TO_BACK = {
            'COORD_A': ['COORD_B'],
            'COORD_B': ['COORD_A'],
            'PREP_A': ['PREP_B'],
            'PREP_B': ['PREP_A', 'WC_C'],
            'WC_A': ['WC_B'],
            'WC_B': ['WC_A', 'WC_C'],
            'WC_C': ['WC_B', 'PREP_B']
        };

        const OPENING_SHIFTS = ['COORD_A', 'PREP_A', 'WC_A'];
        const CLOSING_SHIFTS = ['WC_C']; 

        const safeSetItem = (key, value) => {
            try {
                localStorage.setItem(key, value);
            } catch (error) {
                console.warn(`Local storage error saving ${key}. Quota may be exceeded.`, error);
            }
        };

        const App = () => {
            const fileInputRef = useRef(null);
            const newStudentNameRef = useRef(null);

            const [isDarkMode, setIsDarkMode] = useState(() => {
                try { return JSON.parse(localStorage.getItem('scheduler_dark_mode')) || false; } catch(e) { return false; }
            });

            const [settings, setSettings] = useState(() => {
                try {
                    const saved = localStorage.getItem('scheduler_settings_v4');
                    return saved ? JSON.parse(saved) : { maxHours: 29, poolCoord: 6, poolGeneral: 33 };
                } catch(e) { return { maxHours: 29, poolCoord: 6, poolGeneral: 33 }; }
            });

            const [students, setStudents] = useState(() => {
                try {
                    const saved = localStorage.getItem('scheduler_students_v3');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        return parsed.map(s => ({
                            ...s,
                            unavailable: (s.unavailable || []).map(u => u.includes('::') ? u : u.replace('-', '::'))
                        }));
                    }
                    return [];
                } catch(e) { return []; }
            });

            const [targets, setTargets] = useState(() => {
                try {
                    const saved = localStorage.getItem('scheduler_targets_v4');
                    return saved ? JSON.parse(saved) : {
                        COORD_A: { weekday: 2, weekend: 1 }, 
                        COORD_B: { weekday: 2, weekend: 1 }, 
                        PREP_A: { weekday: 5, weekend: 5 }, 
                        PREP_B: { weekday: 5, weekend: 5 }, 
                        WC_A: { weekday: 2, weekend: 2 }, 
                        WC_B: { weekday: 2, weekend: 2 }, 
                        WC_C: { weekday: 3, weekend: 3 }
                    };
                } catch(e) { return { 
                    COORD_A: { weekday: 2, weekend: 1 }, 
                    COORD_B: { weekday: 2, weekend: 1 }, 
                    PREP_A: { weekday: 5, weekend: 5 }, 
                    PREP_B: { weekday: 5, weekend: 5 }, 
                    WC_A: { weekday: 2, weekend: 2 }, 
                    WC_B: { weekday: 2, weekend: 2 }, 
                    WC_C: { weekday: 3, weekend: 3 } 
                }; }
            });

            const [schedules, setSchedules] = useState(() => {
                try {
                    const saved = localStorage.getItem('scheduler_schedules_v3');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        const migrated = {};
                        Object.keys(parsed).forEach(week => {
                            migrated[week] = {};
                            Object.keys(parsed[week]).forEach(slot => {
                                const newSlot = slot.includes('::') ? slot : slot.replace('-', '::');
                                migrated[week][newSlot] = parsed[week][slot];
                            });
                        });
                        return migrated;
                    }
                    return { 1: {} };
                } catch(e) { return { 1: {} }; }
            });

            const [currentWeek, setCurrentWeek] = useState(1);
            const [activeTab, setActiveTab] = useState('roster'); 
            const [activeGridTab, setActiveGridTab] = useState('COORD');
            
            const [newStudentRole, setNewStudentRole] = useState("GENERAL");
            const [editingStudentId, setEditingStudentId] = useState(null); 
            
            const [confirmDialog, setConfirmDialog] = useState(null);
            const [infoDialog, setInfoDialog] = useState(null);
            const [openDropdown, setOpenDropdown] = useState(null);

            const schedule = schedules[currentWeek] || {};

            useEffect(() => { safeSetItem('scheduler_dark_mode', JSON.stringify(isDarkMode)); document.documentElement.classList.toggle('dark', isDarkMode); }, [isDarkMode]);
            useEffect(() => { safeSetItem('scheduler_settings_v4', JSON.stringify(settings)); }, [settings]);
            useEffect(() => { safeSetItem('scheduler_students_v3', JSON.stringify(students)); }, [students]);
            useEffect(() => { safeSetItem('scheduler_targets_v4', JSON.stringify(targets)); }, [targets]);
            useEffect(() => { safeSetItem('scheduler_schedules_v3', JSON.stringify(schedules)); }, [schedules]);

            const updateCurrentSchedule = (newScheduleData) => setSchedules(prev => ({ ...prev, [currentWeek]: newScheduleData }));

            const promptConfirm = (title, message, actionText, actionFn, isDestructive = true) => {
                setConfirmDialog({ title, message, actionText, actionFn, isDestructive });
            };

            const promptInfo = (title, message) => {
                setInfoDialog({ title, message });
            };

            const handleDeleteStudent = (idToRemove) => {
                promptConfirm(
                    "Remove Student", 
                    "Are you sure you want to remove this student? This will also remove them from all active schedules.",
                    "Remove Student",
                    () => {
                        setStudents(prev => prev.filter(s => s.id !== idToRemove));
                        setSchedules(prevSchedules => {
                            const updatedSchedules = { ...prevSchedules };
                            Object.keys(updatedSchedules).forEach(weekNum => {
                                const weekSched = { ...updatedSchedules[weekNum] };
                                Object.keys(weekSched).forEach(slotId => {
                                    weekSched[slotId] = weekSched[slotId].filter(id => id !== idToRemove);
                                });
                                updatedSchedules[weekNum] = weekSched;
                            });
                            return updatedSchedules;
                        });
                        if (editingStudentId === idToRemove) setEditingStudentId(null);
                    }
                );
            };

            const handleClearRoster = () => {
                promptConfirm(
                    "Clear Entire Roster",
                    "Are you sure you want to delete ALL students? This will also clear ALL assigned shifts across ALL weeks! This cannot be undone.",
                    "Clear Roster",
                    () => {
                        setStudents([]);
                        setSchedules({ 1: {} });
                        setCurrentWeek(1);
                        setEditingStudentId(null);
                    }
                );
            };

            const globalStats = useMemo(() => {
                const stats = {};
                students.forEach(s => stats[s.id] = { ...s, totalHours: 0, activeWeeks: new Set() });
                
                Object.entries(schedules).forEach(([weekNum, weekSched]) => {
                    Object.entries(weekSched).forEach(([slotId, assignedIds]) => {
                        const parts = slotId.split('::');
                        if (parts.length < 2) return;
                        const shiftId = parts[1];
                        const shiftType = ALL_SHIFTS.find(s => s.id === shiftId);
                        const shiftHours = shiftType ? shiftType.hours : 0; 
                        
                        assignedIds.forEach(id => {
                            if (stats[id]) {
                                stats[id].totalHours += shiftHours;
                                stats[id].activeWeeks.add(weekNum);
                            }
                        });
                    });
                });

                Object.keys(stats).forEach(id => {
                    const weeksWorked = Math.max(stats[id].activeWeeks.size, 1);
                    stats[id].rollingAvg = (stats[id].totalHours / weeksWorked).toFixed(1);
                });

                return stats;
            }, [students, schedules]);

            const studentStats = useMemo(() => {
                const stats = {};
                Object.keys(globalStats).forEach(id => {
                    stats[id] = { ...globalStats[id], currentHours: 0, currentShifts: 0 };
                });

                Object.entries(schedule).forEach(([slotId, assignedIds]) => {
                    const parts = slotId.split('::');
                    if (parts.length < 2) return;
                    const shiftId = parts[1];
                    const shiftType = ALL_SHIFTS.find(s => s.id === shiftId);
                    const shiftHours = shiftType ? shiftType.hours : 0; 
                    
                    assignedIds.forEach(id => {
                        if (stats[id]) {
                            stats[id].currentHours += shiftHours;
                            stats[id].currentShifts += 1;
                        }
                    });
                });

                return stats;
            }, [globalStats, schedule]);

            const coordCount = students.filter(s => s.role === 'COORDINATOR').length;
            const generalCount = students.filter(s => s.role === 'GENERAL').length;

            const isHardOverlap = (day, studentId, targetShiftId, tempSchedule) => {
                if ((tempSchedule[`${day}::${targetShiftId}`] || []).includes(studentId)) return true;
                const blockedBy = OVERLAPS[targetShiftId] || [];
                for (const oId of blockedBy) {
                    if ((tempSchedule[`${day}::${oId}`] || []).includes(studentId)) return true;
                }
                return false;
            };

            const isBackToBack = (day, studentId, targetShiftId, tempSchedule) => {
                const blockedBy = BACK_TO_BACK[targetShiftId] || [];
                for (const bId of blockedBy) {
                    if ((tempSchedule[`${day}::${bId}`] || []).includes(studentId)) return true;
                }
                return false;
            };

            const isTooManyConsecutiveDays = (targetDay, studentId, role, tempSchedule, allSchedules, weekNum) => {
                if (role !== 'GENERAL') return false; 
                const prevSched = allSchedules[weekNum - 1] || {};
                const nextSched = allSchedules[weekNum + 1] || {};
                const worksOnDay = (d, sched) => Object.keys(sched).some(slot => slot.startsWith(`${d}::`) && (sched[slot] || []).includes(studentId));

                const streakTimeline = [
                    ...DAYS.map(d => worksOnDay(d, prevSched)),
                    ...DAYS.map(d => d === targetDay ? true : worksOnDay(d, tempSchedule)),
                    ...DAYS.map(d => worksOnDay(d, nextSched))
                ];

                let currentStreak = 0;
                for (let i = 0; i < streakTimeline.length; i++) {
                    if (streakTimeline[i]) {
                        currentStreak++;
                        if (currentStreak > 3) return true;
                    } else {
                        currentStreak = 0;
                    }
                }
                return false;
            };

            const isClopening = (day, studentId, targetShiftId, tempSchedule, prevWeekSchedule = {}, nextWeekSchedule = {}) => {
                const dayIndex = DAYS.indexOf(day);
                
                if (OPENING_SHIFTS.includes(targetShiftId)) {
                    if (dayIndex > 0) {
                        const prevDay = DAYS[dayIndex - 1];
                        if (CLOSING_SHIFTS.some(closer => (tempSchedule[`${prevDay}::${closer}`] || []).includes(studentId))) return true;
                    } else if (dayIndex === 0) {
                        if (CLOSING_SHIFTS.some(closer => (prevWeekSchedule[`Saturday::${closer}`] || []).includes(studentId))) return true;
                    }
                }
                
                if (CLOSING_SHIFTS.includes(targetShiftId)) {
                    if (dayIndex < 6) {
                        const nextDay = DAYS[dayIndex + 1];
                        if (OPENING_SHIFTS.some(opener => (tempSchedule[`${nextDay}::${opener}`] || []).includes(studentId))) return true;
                    } else if (dayIndex === 6) {
                        if (OPENING_SHIFTS.some(opener => (nextWeekSchedule[`Sunday::${opener}`] || []).includes(studentId))) return true;
                    }
                }
                
                return false;
            };

            const getStudentEligibility = (student, day, shift, tempSchedule, allSchedules, weekNum, stats, currentSettings) => {
                if (shift.track === 'COORDINATOR' && student.role !== 'COORDINATOR') return { isAutoEligible: false, isDisabled: true };
                if (shift.track !== 'COORDINATOR' && student.role !== 'GENERAL') return { isAutoEligible: false, isDisabled: true };

                const wouldExceed = stats.currentHours + shift.hours > currentSettings.maxHours;
                const isUnavailable = (student.unavailable || []).includes(`${day}::${shift.id}`);
                const hardOverlap = isHardOverlap(day, student.id, shift.id, tempSchedule);
                
                const prevWeekSchedule = allSchedules[weekNum - 1] || {};
                const nextWeekSchedule = allSchedules[weekNum + 1] || {};
                const clopening = isClopening(day, student.id, shift.id, tempSchedule, prevWeekSchedule, nextWeekSchedule);
                
                const b2b = isBackToBack(day, student.id, shift.id, tempSchedule);
                const overDays = isTooManyConsecutiveDays(day, student.id, student.role, tempSchedule, allSchedules, weekNum);

                const isDisabled = wouldExceed || isUnavailable || hardOverlap || clopening || overDays;
                const isAutoEligible = !isDisabled && !b2b;

                return { wouldExceed, isUnavailable, hardOverlap, clopening, b2b, overDays, isDisabled, isAutoEligible };
            };

            const handleAutoAssign = () => {
                let newSchedule = { ...schedule };
                
                let currentStats = {};
                Object.keys(studentStats).forEach(id => {
                    currentStats[id] = { ...studentStats[id] };
                });
                
                const fillPass = (shiftGroup) => {
                    let slotsToFill = [];
                    DAYS.forEach(day => {
                        const isWeekend = day === 'Saturday' || day === 'Sunday';
                        shiftGroup.forEach(shift => {
                            if (shift.track === 'PREP_CREW' && isWeekend) return;
                            const slotId = `${day}::${shift.id}`;
                            const targetObj = targets[shift.id] || { weekday: 0, weekend: 0 };
                            const shiftTarget = isWeekend ? targetObj.weekend : targetObj.weekday;
                            const needed = Math.max(0, shiftTarget - (newSchedule[slotId] || []).length);
                            for (let i = 0; i < needed; i++) slotsToFill.push({ day, shift });
                        });
                    });

                    for (let i = slotsToFill.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [slotsToFill[i], slotsToFill[j]] = [slotsToFill[j], slotsToFill[i]];
                    }

                    slotsToFill.forEach(({day, shift}) => {
                        const slotId = `${day}::${shift.id}`;
                        
                        let eligible = students.filter(s => {
                            const stats = currentStats[s.id];
                            if (!stats) return false;
                            
                            const eligibility = getStudentEligibility(s, day, shift, newSchedule, schedules, currentWeek, stats, settings);
                            return eligibility.isAutoEligible;
                        });

                        if (eligible.length > 0) {
                            eligible.sort((a, b) => {
                                const statsA = currentStats[a.id];
                                const statsB = currentStats[b.id];
                                
                                const aUnderTarget = statsA.currentHours < 15;
                                const bUnderTarget = statsB.currentHours < 15;
                                
                                if (aUnderTarget && !bUnderTarget) return -1; 
                                if (!aUnderTarget && bUnderTarget) return 1;  
                                
                                if (statsA.currentHours !== statsB.currentHours) {
                                    return statsA.currentHours - statsB.currentHours;
                                }
                                
                                const aShiftsToday = ALL_SHIFTS.filter(sh => (newSchedule[`${day}::${sh.id}`] || []).includes(a.id)).length;
                                const bShiftsToday = ALL_SHIFTS.filter(sh => (newSchedule[`${day}::${sh.id}`] || []).includes(b.id)).length;
                                
                                return aShiftsToday - bShiftsToday;
                            });

                            const selected = eligible[0];
                            newSchedule[slotId] = [...(newSchedule[slotId] || []), selected.id];
                            currentStats[selected.id].currentHours += shift.hours;
                        }
                    });
                };

                fillPass(SHIFTS.COORD);
                fillPass(SHIFTS.PREP);
                fillPass(SHIFTS.WC);
                updateCurrentSchedule(newSchedule);
            };

            const exportCSV = (isTemplate = false, allWeeks = false) => {
                const rows = [];
                const escapeCSV = (str) => {
                    let safeStr = String(str).replace(/"/g, '""');
                    if (/^[=+\-@]/.test(safeStr)) safeStr = "'" + safeStr;
                    return `"${safeStr}"`;
                };
                
                if (isTemplate) {
                    const headers = ["Name", "Role (COORDINATOR/GENERAL)"];
                    let numSlots = 0;
                    DAYS.forEach(d => ALL_SHIFTS.forEach(s => {
                        if (s.track === 'PREP_CREW' && (d === 'Sunday' || d === 'Saturday')) return;
                        headers.push(`${d.substring(0,3)}::${s.id}`);
                        numSlots++;
                    }));
                    rows.push(headers);
                    rows.push(["Example Coord", "COORDINATOR", ...Array(numSlots).fill("Leave blank for Available, type 'X' for Unavailable")]);
                    rows.push(["Example Staff", "GENERAL", ...Array(numSlots).fill("")]);
                } else {
                    const weeksToExport = allWeeks ? Object.keys(schedules).sort((a,b) => parseInt(a) - parseInt(b)) : [currentWeek];
                    
                    weeksToExport.forEach(weekNum => {
                        const weekSched = schedules[weekNum] || {};
                        rows.push([`--- WEEK ${weekNum} SCHEDULE ---`]);
                        rows.push(["Day", "Track", "Shift", "Assigned Students"]);
                        
                        DAYS.forEach(day => {
                            ALL_SHIFTS.forEach(shift => {
                                if (shift.track === 'PREP_CREW' && (day === 'Sunday' || day === 'Saturday')) return;
                                const slotId = `${day}::${shift.id}`;
                                const assignedIds = weekSched[slotId] || [];
                                const studentNames = assignedIds.map(id => {
                                    const s = students.find(st => st.id === id); 
                                    const avg = globalStats[id] ? globalStats[id].rollingAvg : "0.0";
                                    return s ? `${s.name} (${avg}h)` : "";
                                }).filter(n => n).join(", ");
                                rows.push([day, shift.track, shift.name, studentNames]);
                            });
                        });
                        
                        rows.push([]); 
                    });
                }

                const blob = new Blob([rows.map(r => r.map(escapeCSV).join(",")).join("\n")], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = isTemplate ? `import_template.csv` : (allWeeks ? `schedule_all_weeks.csv` : `schedule_week_${currentWeek}.csv`);
                link.click();
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const text = event.target.result;
                        const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
                        const headers = lines[0].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(h => h.trim().replace(/^"|"$/g, ''));
                        
                        const newStudents = lines.slice(1).map((line, index) => {
                            const cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.trim().replace(/^"|"$/g, ''));
                            const role = cols[1]?.toUpperCase().includes('COORD') ? 'COORDINATOR' : 'GENERAL';
                            
                            const unavailable = [];
                            for(let i=2; i<cols.length; i++) {
                                if(cols[i] && cols[i].toLowerCase() !== 'available') {
                                    const delimiter = headers[i]?.includes('::') ? '::' : '-';
                                    const parts = headers[i]?.split(delimiter);
                                    
                                    if(parts && parts.length === 2) {
                                        const fullDay = DAYS.find(d => d.startsWith(parts[0]));
                                        if (fullDay) unavailable.push(`${fullDay}::${parts[1]}`);
                                    }
                                }
                            }
                            return { id: crypto.randomUUID(), name: cols[0], role, unavailable };
                        }).filter(s => s.name && !s.name.includes("Example")); 

                        if (newStudents.length > 0) {
                            promptConfirm(
                                "Import Students",
                                `Import ${newStudents.length} students? This clears ALL existing schedules.`,
                                "Import Data",
                                () => {
                                    setStudents(newStudents);
                                    setSchedules({ 1: {} });
                                    setCurrentWeek(1);
                                },
                                false
                            );
                        }
                    } catch (error) {
                        promptInfo("Error", "Error parsing CSV. Please ensure the file follows the template format.");
                    } finally {
                        if (fileInputRef.current) fileInputRef.current.value = ''; 
                    }
                };
                reader.readAsText(file);
            };

            const toggleAvailability = (studentId, slotId) => {
                const student = students.find(s => s.id === studentId);
                if (!student) return;
                const isUnavailable = (student.unavailable || []).includes(slotId);
                
                setStudents(students.map(s => {
                    if (s.id === studentId) {
                        return isUnavailable 
                            ? { ...s, unavailable: (s.unavailable || []).filter(u => u !== slotId) } 
                            : { ...s, unavailable: [...(s.unavailable || []), slotId] };
                    }
                    return s;
                }));
            };

            const renderShiftRow = (shift) => {
                const targetObj = targets[shift.id] || { weekday: 0, weekend: 0 };
                
                return (
                    <tr key={shift.id}>
                        <td className="sticky left-0 z-10 p-3 border-b border-r border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.05)] dark:shadow-[2px_0_5px_-2px_rgba(0,0,0,0.5)]">
                            <div className="font-semibold text-gray-800 dark:text-gray-200">{shift.name}</div>
                            <div className="text-xs text-gray-500 mt-1 flex justify-between">
                                <span>{shift.hours}h</span>
                                <span className="text-right">Target: {targetObj.weekday} (Wkdy) / {targetObj.weekend} (Wknd)</span>
                            </div>
                        </td>
                        {DAYS.map(day => {
                            const isWeekend = day === 'Saturday' || day === 'Sunday';
                            const slotId = `${day}::${shift.id}`;
                            
                            if (shift.track === 'PREP_CREW' && isWeekend) {
                                return (
                                    <td key={slotId} className="p-2 border-b border-l border-gray-300 dark:border-gray-700 min-w-[170px] align-middle bg-gray-100 dark:bg-gray-800/50">
                                        <div className="text-center text-gray-400 dark:text-gray-500 text-xs font-medium italic">No Shift</div>
                                    </td>
                                );
                            }

                            const assigned = schedule[slotId] || [];
                            const target = isWeekend ? targetObj.weekend : targetObj.weekday;
                            const isMet = assigned.length >= target;
                            const isCoord = shift.track === 'COORDINATOR';
                            
                            let cellBg = '';
                            if (target > 0) {

                                                <option value="COORDINATOR">Coordinator</option>
                                            </select>
                                        </div>
                                        <div className="flex items-end">
                                             <button onClick={() => handleDeleteStudent(editingStudentId)} className="px-4 py-2 border border-red-300 text-red-600 rounded hover:bg-red-50 dark:border-red-800/50 dark:hover:bg-red-900/30">Delete Student</button>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Availability Matrix (Click to block off time)</label>
                                        <div className="bg-blue-50 dark:bg-blue-900/20 text-blue-800 dark:text-blue-300 p-2 text-sm rounded mb-3 border border-blue-200 dark:border-blue-800/50">
                                            {editingStudent.role === 'COORDINATOR' ? "Coordinators only manage availability for Coordinator shifts." : "General Staff manage availability for Welcome Center and Prep Crew."}
                                        </div>
                                        <div className="grid grid-cols-7 gap-2">
                                            {DAYS.map(day => (
                                                <div key={day} className="space-y-1">
                                                    <div className="text-center text-sm font-bold bg-gray-100 dark:bg-gray-700 py-1 rounded border border-gray-200 dark:border-gray-600">{day.substring(0,3)}</div>
                                                    {ALL_SHIFTS.filter(shift => {
                                                        if (editingStudent.role === 'COORDINATOR' && shift.track !== 'COORDINATOR') return false;
                                                        if (editingStudent.role !== 'COORDINATOR' && shift.track === 'COORDINATOR') return false;
                                                        if (shift.track === 'PREP_CREW' && (day === 'Sunday' || day === 'Saturday')) return false;
                                                        return true;
                                                    }).map(shift => {
                                                        const slotId = `${day}::${shift.id}`;
                                                        const isOff = (editingStudent.unavailable || []).includes(slotId);
                                                        return (
                                                            <button key={slotId} onClick={() => toggleAvailability(editingStudentId, slotId)} className={`w-full p-1.5 text-xs rounded border transition-colors ${isOff ? 'bg-red-100 border-red-300 text-red-800 dark:bg-red-900/40' : 'bg-white hover:bg-gray-100 border-gray-300 dark:bg-gray-800 dark:border-gray-600'}`}>
                                                                <div className="font-semibold">{shift.name}</div>
                                                                <div className="text-[10px] mt-0.5">{isOff ? '❌ OFF' : '✅ Free'}</div>
                                                            </button>
                                                        )
                                                    })}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                                <div className="p-4 border-t border-gray-300 dark:border-gray-700 flex justify-end bg-gray-100 dark:bg-gray-900 rounded-b-lg">
                                    <button onClick={() => setEditingStudentId(null)} className="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded font-medium shadow-sm">Done</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Custom Confirmation Modal */}
                    {confirmDialog && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4 animate-in fade-in duration-200">
                            <div className="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-xl border border-gray-300 dark:border-gray-700 max-w-md w-full">
                                <h3 className="text-xl font-bold mb-3 text-gray-900 dark:text-gray-100">{confirmDialog.title}</h3>
                                <p className="mb-6 text-gray-600 dark:text-gray-300">{confirmDialog.message}</p>
                                <div className="flex justify-end gap-3">
                                    <button onClick={() => setConfirmDialog(null)} className="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded bg-white dark:bg-gray-700 text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-600 transition-colors font-medium">
                                        Cancel
                                    </button>
                                    <button 
                                        onClick={() => { confirmDialog.actionFn(); setConfirmDialog(null); }} 
                                        className={`px-4 py-2 rounded text-white font-medium shadow-sm transition-colors ${confirmDialog.isDestructive ? 'bg-red-600 hover:bg-red-700' : 'bg-blue-600 hover:bg-blue-700'}`}
                                    >
                                        {confirmDialog.actionText}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Info Modal */}
                    {infoDialog && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4 animate-in fade-in duration-200">
                            <div className="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-xl border border-gray-300 dark:border-gray-700 max-w-md w-full">
                                <h3 className="text-xl font-bold mb-3 text-gray-900 dark:text-gray-100">{infoDialog.title}</h3>
                                <p className="mb-6 text-gray-600 dark:text-gray-300">{infoDialog.message}</p>
                                <div className="flex justify-end">
                                    <button onClick={() => setInfoDialog(null)} className="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded bg-blue-600 hover:bg-blue-700 text-white transition-colors font-medium shadow-sm">
                                        OK
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
